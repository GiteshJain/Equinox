# The automatic checks (decision #9): keys and passwords, the schedule check, the planner (every screen, look-only
# previews, known answers) and the website, on every pull request and every change to main. A red result means no
# merge: Claude never asks for or makes one while it's red. The result, with what failed, is posted as "Checks: results".
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  checks: write   # posts "Checks: results" with the details

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the test browser
        run: |
          pip install -q playwright==1.56.0
          python -m playwright install --with-deps chromium > /dev/null

      - name: Run the checks
        run: bash tests/run_all.sh 2>&1 | tee "$RUNNER_TEMP/checks.log"

      - name: Post the result
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          log="$RUNNER_TEMP/checks.log"
          if [ "${{ job.status }}" = "success" ]; then conclusion=success; title="All checks passed"; else conclusion=failure; title="Checks failed: no merge until they pass"; fi
          {
            echo '```'
            sed -n '/^=== Summary/,$p' "$log" 2>/dev/null
            echo
            grep -A12 '^FAIL' "$log" 2>/dev/null | head -n 120
            echo '```'
          } > "$RUNNER_TEMP/summary.md"
          gh api "repos/${{ github.repository }}/check-runs" -f name="Checks: results" -f head_sha="$SHA" \
            -f status=completed -f conclusion="$conclusion" -f "output[title]=$title" \
            -f "output[summary]=$(head -c 60000 "$RUNNER_TEMP/summary.md")" > /dev/null
