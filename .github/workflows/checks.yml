# The automatic checks (decision #9): keys and passwords, the schedule check, the planner (types, lint, unit tests, its
# screens' figures against saved answers, build), the planning library, the weekly report, the airline briefing, the
# market definitions (scan_markets.py and nl_analyze.py) and the website, on every
# pull request and every change to main. A red result means no
# merge: Claude never asks for or makes one while it's red. The result, with what failed, is posted on the pull request.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write   # posts the result, with what failed, on the pull request
  issues: write

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Ubuntu 24.04, pinned: ubuntu-latest became 26.04 on 20 Oct, where Playwright 1.56 can't install its dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the test browser
        run: |
          pip install -q playwright==1.56.0
          python -m playwright install --with-deps chromium > /dev/null

      # The weekly report's test (tests/report_test.py) runs the report's scripts: pinned, as the report is made with them
      - name: Install the weekly report's libraries and fonts
        run: |
          pip install -q reportlab==5.0.1 matplotlib==3.11.2 pypdf==5.9.0
          [ -f /usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf ] || { sudo apt-get update -qq && sudo apt-get install -y -qq fonts-liberation > /dev/null; }

      - name: Run the checks
        env:
          REPORT_TEST_OUT: ${{ runner.temp }}/weekly-report   # the report test leaves its PDF here
        run: bash tests/run_all.sh 2>&1 | tee "$RUNNER_TEMP/checks.log"

      # What the weekly report looks like on the report sample: the report test's PDF, kept a week
      - name: Keep the report test's PDF
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: ${{ runner.temp }}/weekly-report/*.pdf
          if-no-files-found: ignore
          retention-days: 7

      - name: Post the result on the pull request
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          log="$RUNNER_TEMP/checks.log"
          {
            echo "<!-- equinox-checks -->"
            if [ "${{ job.status }}" = "success" ]; then echo "**Checks: all passed**"; else echo "**Checks: failed. No merge until they pass**"; fi
            echo
            echo "Commit ${HEAD_SHA:0:7} · $(date -u '+%d %b %H:%M UTC')"
            echo
            echo '```'
            sed -n '/^=== Summary/,$p' "$log" 2>/dev/null
            if grep -q '^FAIL' "$log" 2>/dev/null; then echo; grep -A12 '^FAIL' "$log" | head -n 120; fi
            echo '```'
          } > "$RUNNER_TEMP/comment.md"
          # one comment per pull request, updated on every run
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | select(.body | contains("<!-- equinox-checks -->")) | .id' | tail -n 1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          else gh api "repos/$REPO/issues/$PR/comments" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null; fi
