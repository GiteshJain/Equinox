# Rehearses a pull request's database changes on a copy of last night's backup (decision #8), then lets the pull
# request's own planner sign in and work for real on that copy (#17, #18): its types generated again from the copy and
# compared with the committed ones, every screen opened at a frozen moment at 1280 and 380 px, every kind of save made
# through its own controls and checked against the recorded rows, and the addresses web/_redirects gives; then, when
# there were changes, the copy is backed up and restored as the nightly job does (database/rehearse.sh says each step).
# On a pull request it runs only the parts the change can affect (to-do 233; brief docs/briefs/2026-11-11-faster-checks.md,
# option E; spec docs/specs/2026-11-11-faster-checks.md): the first job, parts, reads the paths the pull request changes
# and database/rehearsal_parts.py names the parts (a path on no list starts every part; documents start none, and then
# the rehearsal doesn't run at all). Every night on main (08:43 UTC, after the nightly backup at 07:17) it runs every
# part. GitHub emails the person who last changed the schedule below when a nightly run fails.
# The copy comes from Cloudflare R2, read with a read-only
# key (decision #16), and is restored into a full local Supabase (database, data API and sign-in) on the runner. The
# result is posted on the pull request; Claude applies a change to the live database only after it passes here and
# Gitesh says "merge".
name: Database rehearsal

on:
  pull_request:
  schedule:
    - cron: "43 8 * * *"   # every night on main, after the nightly backup (07:17 UTC, which GitHub can start late)
  workflow_dispatch:       # the nightly run, started by hand from GitHub's Actions page

permissions:
  contents: read
  pull-requests: write   # posts the result on the pull request

concurrency:
  group: rehearsal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts this run needs: on a pull request, from the paths it changes since its base; otherwise (the nightly run)
  # every part. The reasons, one line per path, go to the run's summary.
  parts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      parts: ${{ steps.parts.outputs.parts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # to compare with the base branch

      - name: Choose the parts this change can affect
        id: parts
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            python3 database/rehearsal_parts.py --base "origin/${{ github.base_ref }}" > "$RUNNER_TEMP/parts.txt"
          else
            echo "the nightly run on main: every part" > "$RUNNER_TEMP/parts.txt"
            echo "parts=all" >> "$RUNNER_TEMP/parts.txt"
          fi
          cat "$RUNNER_TEMP/parts.txt"
          tail -n 1 "$RUNNER_TEMP/parts.txt" >> "$GITHUB_OUTPUT"
          {
            echo "### Database rehearsal: the parts this change needs"
            echo '```'
            cat "$RUNNER_TEMP/parts.txt"
            echo '```'
            if [ "$(tail -n 1 "$RUNNER_TEMP/parts.txt")" = "parts=" ]; then echo "Nothing to rehearse: no changed path can affect what it checks."; fi
          } >> "$GITHUB_STEP_SUMMARY"

  rehearse:
    needs: parts
    if: needs.parts.outputs.parts != ''
    runs-on: ubuntu-latest
    # 45 since 26 Oct: runs take 15 to 27 minutes, and with several pull requests at once some passed 30 and were cancelled
    timeout-minutes: 45
    defaults:
      run:
        shell: bash   # bash -eo pipefail: a failing script fails its step even though its output goes through tee
    env:
      LOG: ${{ github.workspace }}/../rehearsal.log
      REHEARSE_PARTS: ${{ needs.parts.outputs.parts }}
      REHEARSE_NIGHTLY: ${{ github.event_name == 'pull_request' && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # to compare with the base branch

      # Reads latest.json in R2, downloads the copy it names, checks its SHA-256 and unpacks it into .backup/ (db/,
      # files/, MANIFEST.md, and latest.json, which says which night it is). Fails with a plain message if the R2
      # reader keys aren't set up. The log names R2 keys (object names) only, never the endpoint or keys.
      - name: Get last night's backup from R2
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_READ_ACCESS_KEY_ID }}       # the R2 reader key (read-only)
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_READ_SECRET_ACCESS_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required   # newer AWS CLIs add checksums that R2 can refuse
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: bash database/backup/download.sh .backup 2>&1 | tee -a "$LOG"

      # Pinned (#18): the new planner's types are generated by this CLI's postgres-meta, and must come out the same on
      # every run unless the database changes. Moving it on is a pull request of its own, with the types it gives.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Install psql 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common > /dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          sudo apt-get install -y -qq postgresql-client-17 > /dev/null
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      # For the planner on the copy (#17, #18): the browser that opens it, and npm to build it
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Pinned, the same as checks.yml: the oldest Playwright that installs on Ubuntu 26.04 (tests/README.md, "The test browser")
      - name: Install the test browser
        run: |
          pip install -q playwright==1.61.0
          python -m playwright install --with-deps chromium > /dev/null

      # A pull request that changes how the test sample is made also gets a new one, made from the rehearsal's copy after
      # its changes (tests/README.md, "The sample"); likewise the capture's saved pages (#21, "The capture sample"). It is kept as this run's artifact for a day, to be checked and
      # committed; it is the same small sample of game data the repository may hold (decision #9), never keys. The same
      # for the weekly report's sample (tests/README.md, "The report sample"), kept as the report-sample artifact, and
      # the airline briefing's (#24, "The briefing sample"), kept as the briefing-sample artifact.
      # The planner's types generated from the copy go to TYPES_DIR either way, kept as the planner-types artifact, so
      # a helper can fetch and commit them when they differ (design §5); the same for the table guide (DOCS_DIR, the
      # data-guide artifact, docs/data.md as the copy gives it).
      - name: Rehearse the changes
        env:
          TYPES_DIR: ${{ runner.temp }}/planner-types
          DOCS_DIR: ${{ runner.temp }}/data-guide
          PLANNER_SCREENS_DIR: ${{ runner.temp }}/planner-screens   # every screen at the frozen moment, at 1280 and 380 px (#18 build pull request 14)
          SAVES_OUT_DIR: ${{ runner.temp }}/planner-saves   # every save's answer as this run found it (#18 build pull request 14)
          FIGURES_DIR: ${{ runner.temp }}/figures-moved   # every captured figure the changes moved, before and after (small fixes, 15 Oct)
          FUNCTIONS_DIR: ${{ runner.temp }}/current-functions   # every function as the copy defines it, in database/current/functions.sql's format
        run: |
          # the samples are made only on a pull request that changes how they are made, never at night
          if [ "${{ github.event_name }}" != pull_request ] || git diff --quiet "origin/${{ github.base_ref }}"...HEAD -- tests/fixtures/make_sample.sh tests/fixtures/sample.sql; then
            unset SAMPLE_DIR
          else
            export SAMPLE_DIR="${{ runner.temp }}/sample"
          fi
          if [ "${{ github.event_name }}" != pull_request ] || git diff --quiet "origin/${{ github.base_ref }}"...HEAD -- tests/fixtures/report_sample.sql tests/fixtures/report_sample.py; then
            unset REPORT_SAMPLE_DIR
          else
            export REPORT_SAMPLE_DIR="${{ runner.temp }}/report-sample"
          fi
          if [ "${{ github.event_name }}" != pull_request ] || git diff --quiet "origin/${{ github.base_ref }}"...HEAD -- tests/fixtures/capture_sample.sql; then
            unset CAPTURE_SAMPLE_DIR
          else
            export CAPTURE_SAMPLE_DIR="${{ runner.temp }}/capture-sample"
          fi
          if [ "${{ github.event_name }}" != pull_request ] || git diff --quiet "origin/${{ github.base_ref }}"...HEAD -- tests/fixtures/briefing_sample.sql tests/fixtures/briefing_sample.py; then
            unset BRIEFING_SAMPLE_DIR
          else
            export BRIEFING_SAMPLE_DIR="${{ runner.temp }}/briefing-sample"
          fi
          bash database/rehearse.sh .backup "${{ github.base_ref }}" 2>&1 | tee -a "$LOG"

      - name: Keep the planner's types generated from the copy
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: planner-types
          path: ${{ runner.temp }}/planner-types/types.ts
          if-no-files-found: ignore
          retention-days: 3

      # docs/data.md as the copy gives it, to commit when the descriptions change (decision #10)
      - name: Keep the table guide made from the copy
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: data-guide
          path: ${{ runner.temp }}/data-guide/data.md
          if-no-files-found: ignore
          retention-days: 3

      # Every screen on the copy at the frozen moment, at 1280 and 380 px (tests/planner_next_test.py), for review: it
      # shows live data, so it's kept three days only, like the types, and never committed
      - name: Keep the screenshots of every screen
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: planner-screens
          path: ${{ runner.temp }}/planner-screens/*.png
          if-no-files-found: ignore
          retention-days: 3

      # every save's answer as this run found it (tests/planner_saves_test.py): what tests/fixtures/planner_saves.expected.json
      # is made from, when a pull request means to change what a save writes
      - name: Keep the saves' answers
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: planner-saves
          path: ${{ runner.temp }}/planner-saves/planner_saves.json
          if-no-files-found: ignore
          retention-days: 7

      # every captured figure the changes moved, before and after (database/figures_moved.py), for the pull request to
      # say which moved and by how much: live figures, so kept three days only and never committed
      - name: Keep the figures the changes moved
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: figures-moved
          path: ${{ runner.temp }}/figures-moved/figures_moved.md
          if-no-files-found: ignore
          retention-days: 3

      # every function as the copy defines it, in database/current/functions.sql's format (database/reference.py): what to
      # copy an entry from when the reference check finds the file missing one or out of step
      - name: Keep the copy's functions
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: current-functions
          path: ${{ runner.temp }}/current-functions/functions.sql
          if-no-files-found: ignore
          retention-days: 3

      - name: Keep the new test sample
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-sample
          path: ${{ runner.temp }}/sample/*.json.gz
          if-no-files-found: ignore
          retention-days: 1

      # one airline's capture pages of one evening, with what to expect of them and the rows they give (#21), when a pull
      # request changes how it is made: checked and committed as tests/fixtures/capture_pages_<capture day>.json.gz
      - name: Keep the new capture sample
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: capture-sample
          path: ${{ runner.temp }}/capture-sample/*.json.gz
          if-no-files-found: ignore
          retention-days: 1

      - name: Keep the new report sample
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: report-sample
          path: ${{ runner.temp }}/report-sample/*.json.gz
          if-no-files-found: ignore
          retention-days: 1

      # what scripts/briefing/brief.py reads for every one of our airlines (#24), when a pull request changes how it is
      # made: checked and committed as tests/fixtures/briefing_<date>.json.gz
      - name: Keep the new briefing sample
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: briefing-sample
          path: ${{ runner.temp }}/briefing-sample/*.json.gz
          if-no-files-found: ignore
          retention-days: 1

      - name: Post the result on the pull request
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            if [ "${{ job.status }}" = "success" ]; then echo "**Database rehearsal: passed**"; else echo "**Database rehearsal: failed**"; fi
            echo
            echo '```'
            grep -vE '^\s*$' "$LOG" 2>/dev/null | sed -E 's#postgres(ql)?://[^[:space:]]*#[database]#g; s#(https?://)?[[:alnum:].-]*\.r2\.cloudflarestorage\.com#[R2]#g' | tail -n 60 || echo "no output: see the run's log"
            echo '```'
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "${{ github.event.pull_request.number }}" --body-file "$RUNNER_TEMP/comment.md"
