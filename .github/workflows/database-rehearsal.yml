# Rehearses a pull request's database changes on a copy of last night's backup (decision #8).
# Runs when a pull request adds or changes a migration, or changes this check. The result is posted on the pull
# request; Claude applies a change to the live database only after it passes here and Gitesh says "merge".
name: Database rehearsal

on:
  pull_request:
    paths:
      - "database/migrations/**"
      - "database/rehearse.sh"
      - "database/describe.*"
      - "docs/data.md"
      - ".github/workflows/database-rehearsal.yml"

permissions:
  contents: read
  pull-requests: write   # posts the result on the pull request

concurrency:
  group: rehearsal-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash   # bash -eo pipefail: a failing script fails its step even though its output goes through tee
    env:
      BACKUPS_KEY: ${{ secrets.BACKUPS_READ_TOKEN }}   # read-only key for equinox-backups, held as a secret
      LOG: ${{ github.workspace }}/../rehearsal.log
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # to compare with the base branch

      - name: Check the read-only key is set up
        if: env.BACKUPS_KEY == ''
        run: |
          echo "The read-only key for the backups isn't set up yet (secret BACKUPS_READ_TOKEN; see the planner's To-do board)." | tee -a "$LOG"
          exit 1

      - name: Get last night's backup
        uses: actions/checkout@v4
        with:
          repository: GiteshJain/equinox-backups
          token: ${{ secrets.BACKUPS_READ_TOKEN }}
          path: .backup
          fetch-depth: 1
          sparse-checkout: |
            db
            scripts

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install psql 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common > /dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          sudo apt-get install -y -qq postgresql-client-17 > /dev/null
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Rehearse the changes
        run: bash database/rehearse.sh .backup "${{ github.base_ref }}" 2>&1 | tee -a "$LOG"

      - name: Post the result on the pull request
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            if [ "${{ job.status }}" = "success" ]; then echo "**Database rehearsal: passed**"; else echo "**Database rehearsal: failed**"; fi
            echo
            echo '```'
            grep -vE '^\s*$' "$LOG" 2>/dev/null | sed -E 's#postgres(ql)?://[^[:space:]]*#[database]#g' | tail -n 60 || echo "no output: see the run's log"
            echo '```'
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "${{ github.event.pull_request.number }}" --body-file "$RUNNER_TEMP/comment.md"
