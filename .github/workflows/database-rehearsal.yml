# Rehearses a pull request's database changes on a copy of last night's backup (decision #8), then lets the pull
# request's own planners sign in and save for real into that copy (#17): the new planner at /planner/next/ (#18) through
# planner_save(), after its types are generated again from the copy and compared with the committed ones, then the old one;
# the planning library (#19) side by side with the old planner's Tails and Hubs on the copy; the captured figures
# (#19) side by side with the old planner's Review and Check; and the new planner's Home side by side with the old Home.
# Runs when a pull request adds or changes a migration or a database test, changes either planner (a planner change can
# break saving), the planning library (lib/) or their tests, or changes this check. The copy comes from Cloudflare R2, read with a read-only
# key (decision #16), and is restored into a full local Supabase (database, data API and sign-in) on the runner. The
# result is posted on the pull request; Claude applies a change to the live database only after it passes here and
# Gitesh says "merge".
name: Database rehearsal

on:
  pull_request:
    paths:
      - "database/migrations/**"
      - "database/tests/**"
      - "database/rehearse.sh"
      - "database/backup/**"
      - "database/describe.*"
      - "docs/data.md"
      - "web/planner/**"
      - "app/**"
      - "lib/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "tests/planner_next_test.py"
      - "tests/real_saves_test.py"
      - "tests/rules_library_test.py"
      - "tests/captured_figures_test.py"
      - "tests/home_side_by_side_test.py"
      - "tests/rule_numbers_test.py"
      - "tests/harness.py"
      - "tests/fixtures/make_sample.sh"
      - "tests/fixtures/sample.sql"
      - "tests/fixtures/report_sample.sql"
      - "tests/fixtures/report_sample.py"
      - ".github/workflows/database-rehearsal.yml"

permissions:
  contents: read
  pull-requests: write   # posts the result on the pull request

concurrency:
  group: rehearsal-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # two restores when a pull request changes both the planner and the database
    defaults:
      run:
        shell: bash   # bash -eo pipefail: a failing script fails its step even though its output goes through tee
    env:
      LOG: ${{ github.workspace }}/../rehearsal.log
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # to compare with the base branch

      # Reads latest.json in R2, downloads the copy it names, checks its SHA-256 and unpacks it into .backup/ (db/,
      # files/, MANIFEST.md, and latest.json, which says which night it is). Fails with a plain message if the R2
      # reader keys aren't set up. The log names R2 keys (object names) only, never the endpoint or keys.
      - name: Get last night's backup from R2
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_READ_ACCESS_KEY_ID }}       # the R2 reader key (read-only)
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_READ_SECRET_ACCESS_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required   # newer AWS CLIs add checksums that R2 can refuse
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: bash database/backup/download.sh .backup 2>&1 | tee -a "$LOG"

      # Pinned (#18): the new planner's types are generated by this CLI's postgres-meta, and must come out the same on
      # every run unless the database changes. Moving it on is a pull request of its own, with the types it gives.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Install psql 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common > /dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          sudo apt-get install -y -qq postgresql-client-17 > /dev/null
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      # For the real saves (#17): the browser that opens the planner, and npm for the planner's own Supabase library
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the test browser
        run: |
          pip install -q playwright==1.56.0
          python -m playwright install --with-deps chromium > /dev/null

      # A pull request that changes how the test sample is made also gets a new one, made from the rehearsal's copy after
      # its changes (tests/README.md, "The sample"). It is kept as this run's artifact for a day, to be checked and
      # committed; it is the same small sample of game data the repository may hold (decision #9), never keys. The same
      # for the weekly report's sample (tests/README.md, "The report sample"), kept as the report-sample artifact.
      # The new planner's types generated from the copy go to TYPES_DIR either way, kept as the planner-types artifact, so
      # a helper can fetch and commit them when they differ (design §5).
      - name: Rehearse the changes
        env:
          TYPES_DIR: ${{ runner.temp }}/planner-types
          HOME_SCREENS_DIR: ${{ runner.temp }}/home-screens   # the new Home and the old at 380 and 1280 px (#18 build pull request 5)
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}"...HEAD -- tests/fixtures/make_sample.sh tests/fixtures/sample.sql; then
            unset SAMPLE_DIR
          else
            export SAMPLE_DIR="${{ runner.temp }}/sample"
          fi
          if git diff --quiet "origin/${{ github.base_ref }}"...HEAD -- tests/fixtures/report_sample.sql tests/fixtures/report_sample.py; then
            unset REPORT_SAMPLE_DIR
          else
            export REPORT_SAMPLE_DIR="${{ runner.temp }}/report-sample"
          fi
          bash database/rehearse.sh .backup "${{ github.base_ref }}" 2>&1 | tee -a "$LOG"

      - name: Keep the new planner's types generated from the copy
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: planner-types
          path: ${{ runner.temp }}/planner-types/types.ts
          if-no-files-found: ignore
          retention-days: 3

      # The new planner's Home and the old Home on the copy, at 380 and 1280 px wide (tests/home_side_by_side_test.py), for review: it shows
      # live data, so it's kept three days only, like the types, and never committed
      - name: Keep the screenshots of the new Home and the old
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: home-screens
          path: ${{ runner.temp }}/home-screens/*.png
          if-no-files-found: ignore
          retention-days: 3

      - name: Keep the new test sample
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-sample
          path: ${{ runner.temp }}/sample/*.json.gz
          if-no-files-found: ignore
          retention-days: 1

      - name: Keep the new report sample
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: report-sample
          path: ${{ runner.temp }}/report-sample/*.json.gz
          if-no-files-found: ignore
          retention-days: 1

      - name: Post the result on the pull request
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            if [ "${{ job.status }}" = "success" ]; then echo "**Database rehearsal: passed**"; else echo "**Database rehearsal: failed**"; fi
            echo
            echo '```'
            grep -vE '^\s*$' "$LOG" 2>/dev/null | sed -E 's#postgres(ql)?://[^[:space:]]*#[database]#g; s#(https?://)?[[:alnum:].-]*\.r2\.cloudflarestorage\.com#[R2]#g' | tail -n 60 || echo "no output: see the run's log"
            echo '```'
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "${{ github.event.pull_request.number }}" --body-file "$RUNNER_TEMP/comment.md"
